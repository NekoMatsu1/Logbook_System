name: Test and build downloads

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Test
        env:
          LOGBOOK_GUI_TEST: '1'
        run: python -m pytest -q
      - name: Build and test portable Windows client
        run: python scripts/build_windows.py
      - name: Package server source
        run: python deploy/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Logbook-downloads
          path: |
            dist/Logbook-Windows-x64.zip
            dist/Logbook-Windows-x64.zip.sha256
            .tools/logbook-deploy.zip
          if-no-files-found: error
          include-hidden-files: true
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libxss1
      - run: python -m pip install -r requirements.txt
      - run: xvfb-run -a python -m pytest -q
        env:
          LOGBOOK_GUI_TEST: '1'
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Logbook-downloads
          path: downloads
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --title "Logbook $GITHUB_REF_NAME (testing)" --notes-file RELEASE-NOTES.md downloads/dist/* downloads/.tools/logbook-deploy.zip
