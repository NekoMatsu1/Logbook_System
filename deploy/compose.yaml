# Linux VPS only: host networking keeps the private admin listener truly loopback.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      LOGBOOK_PRODUCTION: '1'
      LOGBOOK_ADMIN_DIRECT_ONLY: '1'
      LOGBOOK_ADMIN_ADDRESSES: '127.0.0.1,::1'
      LOGBOOK_TRUSTED_PROXY: '127.0.0.1'
      LOGBOOK_TRUSTED_HOSTS: '${LOGBOOK_DOMAIN:?Set LOGBOOK_DOMAIN},localhost,127.0.0.1,[::1]'
      LOGBOOK_SECRET_FILE: /run/secrets/flask_secret
      LOGBOOK_LAB_NETWORKS: '${LOGBOOK_LAB_NETWORKS:?Set the permitted lab public IP/CIDR}'
      # Admin cookies exist only on SSH-forwarded HTTP loopback, never public HTTPS.
      LOGBOOK_HTTPS: '0'
    secrets: [flask_secret]
    volumes:
      - logbook_data:/app/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  edge:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      LOGBOOK_DOMAIN: '${LOGBOOK_DOMAIN:?Set LOGBOOK_DOMAIN}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
secrets:
  flask_secret:
    file: ./secrets/flask_secret
volumes:
  logbook_data:
  caddy_data:
  caddy_config:
